name: Validate skill packages
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            narrated-motion-explainers/requirements.txt
      - name: Install validation and optional motion dependencies
        run: |
          python -m pip install -r requirements-dev.txt -r narrated-motion-explainers/requirements.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -c "import PIL; import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Validate every package
        run: python scripts/validate_skills.py
      - name: Run format regressions and offline script smoke tests
        run: python -m unittest discover -s tests -v
